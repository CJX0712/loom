# Dependabot: keep dependencies current with weekly, reviewable PRs.
# Minor + patch bumps are grouped into a single PR per ecosystem.
# Author: 晨星
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
